           #CC8780 (Rosa Terciopelo Suave)
           #AD3029 (Rojo Borgoña / Velvet Intenso)
           #CD5252 (Rojo Coral Terciopelo)
           #FEEFCD (Crema Suave - Fondo)

        .pill-btn {
            border-radius: 9999px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            position: relative;
            user-select: none;
        }

        .pill-btn:hover {
            transform: translateY(-2px);
            filter: brightness(0.95);
        }

        .pill-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Indicador de botón activo */

            box-shadow: 0 4px 12px rgba(173, 48, 41, 0.35);
            outline: 2px solid #AD3029;
            outline-offset: 2px;
            transform: scale(1.02);
        }

        /* Paneles con fondo crema claro y bordes cálidos */
        .velvet-panel {
            background-color: #FFF9EB;
            border: 1px solid #F3E0B5;
        }

        .velvet-subcard {
            background-color: #FDF3DB;
            border: 1px solid #EBD5A3;

            color: #FEEFCD;

        /* Personalización de la barra de desplazamiento */

        function changeContent(key) {
            const container = document.getElementById('dynamic-content');
            if (!container || !contents[key]) return;

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('nav-btn-active');
            });
            const activeBtn = document.getElementById(`btn-${key}`);
            if (activeBtn) {
                activeBtn.classList.add('nav-btn-active');
            }

            container.style.opacity = '0';
            container.style.transform = 'translateY(4px)';
            
            setTimeout(() => {
                container.innerHTML = contents[key];
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 150);
        }

        function toggleDropdownMenu() {
            const menu = document.getElementById('small-dropdown-menu');
            const arrow = document.getElementById('arrow-icon');
            
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                menu.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        // Cerrar el menú si se hace clic fuera de él
        document.addEventListener('click', (event) => {
            const menu = document.getElementById('small-dropdown-menu');
            const btn = document.getElementById('dropdown-toggle-btn');
            if (menu && !menu.contains(event.target) && !btn.contains(event.target)) {
                menu.classList.add('hidden');
                document.getElementById('arrow-icon').style.transform = 'rotate(0deg)';
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            changeContent('details');
        });
    </script>
